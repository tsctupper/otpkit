name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR updates share a group. Each main run has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run compatibility tests
        if: matrix.node != 22
        run: npm test
      - name: Run the library tests with coverage
        if: matrix.node == 22
        run: npm run coverage
      - name: Check types, lint and formatting
        if: matrix.node == 22
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
      - run: npm run build
      - name: Test the runnable example against the published package
        run: |
          npm ci --prefix examples/two-factor --ignore-scripts
          npm test --prefix examples/two-factor
      - name: Install and import the packed library
        if: matrix.node == 22
        run: |
          npm pack --silent
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null && npm install --silent "$GITHUB_WORKSPACE"/tsctupper-otpkit-*.tgz
          node --input-type=module -e "import { totp, generateSecret } from '@tsctupper/otpkit'; console.log(totp(generateSecret()))"
