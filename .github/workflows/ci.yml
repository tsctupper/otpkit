name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR updates share a group. Each main run has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for dependency additions
        if: matrix.node == 22
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Optional externally installed command for a genuine first push.
          ROOT_ONBOARD: ${{ vars.DEPENDENCY_ONBOARD_COMMAND }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          unknown() { echo "::error::Dependency state unknown. $1" >&2; exit 3; }
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            [[ "$GITHUB_EVENT_NAME" == push && "$ROOT_ONBOARD" == /* && -f "$ROOT_ONBOARD" ]] ||
              unknown "A first push requires the independently installed onboarding command."
            echo "71d9e38af2b0eea7fdfbd04e69a5e5688850f8cc4a36d362a089fca344815842  $ROOT_ONBOARD" | sha256sum -c - ||
              unknown "The onboarding command differs from its reviewed digest."
            # The external command checks raw parents and pins its external scanner and empty baseline.
            exec python3 -I -B "$ROOT_ONBOARD" --repo . --ref "$GITHUB_SHA" --id "$GITHUB_REPOSITORY" --owner maintainer
          fi

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "$GITHUB_SHA" ]] ||
            unknown "The event needs a distinct, full base commit."
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA" 2>/dev/null; then
            history=()
            if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then history+=(--unshallow); fi
            git fetch --no-tags "${history[@]}" "$remote" "$BASE_SHA" "$GITHUB_SHA" || unknown "Incomplete history."
          fi
          [[ "$(git cat-file -t "$BASE_SHA")" == commit ]] || unknown "The base must be a commit."
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA" || unknown "The base is not a proven ancestor."

          policy="$RUNNER_TEMP/dependency-policy"
          mkdir "$policy"
          tools_ref="$BASE_SHA"
          # Only the reviewed upgrade from this exact pre-install revision needs bootstrap pins.
          if [[ "$BASE_SHA" == "3e28e7aeafcee157e7e89783b640df3b1b7eb735" ]]; then tools_ref="$GITHUB_SHA"; fi
          for file in dependency_inventory.py compare_dependencies.py; do
            [[ -s ".github/scripts/$file" ]] || unknown "The candidate is missing a required policy file."
            git show "$tools_ref:.github/scripts/$file" > "$policy/$file" || unknown "The policy file is unavailable."
          done
          if [[ "$tools_ref" != "$BASE_SHA" ]]; then
            echo "9c9d5ab52878bc91f365ba8199d388ba9bd10a743347adc7348df058a8062ef6  $policy/dependency_inventory.py" | sha256sum -c - || unknown "Scanner digest mismatch."
            echo "71c765c25243a27c5116aefd55525e1e2f5a2eb33273e396dc6d1ac6835ecdab  $policy/compare_dependencies.py" | sha256sum -c - || unknown "Comparison digest mismatch."
          fi
          python3 -I -B "$policy/compare_dependencies.py" "$GITHUB_REPOSITORY" "$BASE_SHA" "$GITHUB_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run compatibility tests
        if: matrix.node != 22
        run: npm test
      - name: Run the library tests with coverage
        if: matrix.node == 22
        run: npm run coverage
      - name: Check types, lint and formatting
        if: matrix.node == 22
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
      - run: npm run build
      - name: Test the runnable example against the published package
        run: |
          npm ci --prefix examples/two-factor --ignore-scripts
          npm test --prefix examples/two-factor
      - name: Install and import the packed library
        if: matrix.node == 22
        run: |
          npm pack --silent
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null && npm install --silent "$GITHUB_WORKSPACE"/tsctupper-otpkit-*.tgz
          node --input-type=module -e "import { totp, generateSecret } from '@tsctupper/otpkit'; console.log(totp(generateSecret()))"
