name: Release

# Stages a publish to npm when a GitHub release is published. npm requires
# two-factor approval for the release to go live: approve it from the Staged
# Packages tab on npmjs.com. Authenticates with npm trusted publishing (OIDC);
# no npm token is stored.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # staged publishing needs npm >= 11.15
      - run: npm ci
      - run: npm stage publish --provenance --access public
