name: Release

# Stages a publish to npm when a GitHub release is published. npm requires
# two-factor approval for the release to go live: approve it from the Staged
# Packages tab on npmjs.com. Authenticates with npm trusted publishing (OIDC);
# no npm token is stored.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published release tag
        run: |
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF:$GITHUB_REF"
          git checkout --quiet --detach "$GITHUB_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify the release tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME#[vV]}" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: npm install -g npm@latest # staged publishing needs npm >= 11.15
      - run: npm ci
      - run: npm stage publish --provenance --access public
